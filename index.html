<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Найдите таймер и сделайте вывод</title><style>
:root{--navy:#1B2F4E;--blue:#2E6DB4;--blue-l:#DCE9F7;--cyan-l:#E2F3FB;--teal:#1E9C96;--teal-l:#DCF2EF;
--gray:#7D8A9C;--gray-l:#EEF1F4;--line:#D5DCE5;--warn:#B4572E;--warn-l:#FBEDE6}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--navy);font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;
font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;line-height:1.25;margin:0 0 6px}
.lead{color:var(--gray);margin:0 0 14px;font-size:15px}
.task{background:var(--cyan-l);border-left:4px solid var(--blue);border-radius:10px;padding:12px 14px;margin:0 0 14px;font-size:15px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.scroll svg{display:block;width:100%;min-width:640px;height:auto;touch-action:pan-x pan-y pinch-zoom}
.hint{font-size:13px;color:var(--gray);margin:6px 2px 0}
.hit{cursor:pointer}
.hit .z{fill:#000;fill-opacity:0;stroke:none}
.hit .zl{fill:none;stroke:#000;stroke-opacity:0;stroke-width:26;stroke-linecap:round}
.hit:hover .z{fill:var(--blue);fill-opacity:.06}
.hit.ok .z{fill:var(--teal);fill-opacity:.16;stroke:var(--teal);stroke-width:3}
.hit.ok .zl{stroke:var(--teal);stroke-opacity:.35}
.hit.no .z{fill:var(--gray);fill-opacity:.10;stroke:var(--gray);stroke-width:2;stroke-dasharray:6 4}
.hit.sel .z{fill:var(--blue);fill-opacity:.16;stroke:var(--blue);stroke-width:3}
.hit.sel .zl{stroke:var(--blue);stroke-opacity:.35}
.hit.miss .z{fill:var(--blue);fill-opacity:.10;stroke:var(--blue);stroke-width:3;stroke-dasharray:6 4}
.hit.miss .zl{stroke:var(--blue);stroke-opacity:.25}
.hit.extra .z{fill:var(--warn);fill-opacity:.14;stroke:var(--warn);stroke-width:3}
.hit.extra .zl{stroke:var(--warn);stroke-opacity:.45}
.hit:focus{outline:none}.hit:focus-visible .z{stroke:var(--blue);stroke-width:4}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:15px;min-height:52px;background:var(--gray-l)}
.fb b{display:block;margin-bottom:2px}
.fb.good{background:var(--teal-l)} .fb.bad{background:var(--warn-l)} .fb.info{background:var(--blue-l)}
.status{display:flex;align-items:center;gap:12px;margin:12px 0 0;font-size:14px;color:var(--gray)}
.bar{flex:1;height:8px;background:var(--gray-l);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .25s}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{min-height:44px;padding:8px 16px;border-radius:10px;border:1.5px solid var(--navy);background:#fff;font:inherit;
font-size:15px;font-weight:600;color:var(--navy);cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.btn[hidden]{display:none}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.quiz{margin-top:18px}
.q{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.q p{margin:0 0 8px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;min-height:44px;padding:8px 12px;border-radius:9px;border:1.5px solid var(--line);background:#fff;
font:inherit;font-size:15px;color:var(--navy);cursor:pointer}
.opt.right{border-color:var(--teal);background:var(--teal-l)} .opt.wrong{border-color:var(--warn);background:var(--warn-l)}
.expl{margin-top:8px;font-size:14px}
.cards{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.card{flex:1 1 220px;border-radius:10px;padding:10px 12px;font-size:14px;background:var(--gray-l)}
.card .dot{display:inline-block;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;
text-align:center;line-height:22px;margin-right:6px;vertical-align:middle}
@media (max-width:480px){.wrap{padding:16px 12px 32px}h1{font-size:20px}.btn{flex:1 1 100%}}

.sub{font-size:13px;color:var(--gray);margin:-4px 0 12px}
details.brief{border:1.5px solid var(--line);border-radius:12px;margin:0 0 14px;background:#fff}
details.brief summary{cursor:pointer;padding:12px 14px;font-weight:600;min-height:44px;list-style:none}
details.brief summary::-webkit-details-marker{display:none}
details.brief summary:before{content:"▸ ";color:var(--blue)} details.brief[open] summary:before{content:"▾ "}
details.brief div{padding:0 14px 12px;font-size:15px}
.round{font-size:13px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
.prompt{font-size:16px;font-weight:600;margin:0 0 10px}
.tok{transition:transform .7s ease,opacity .5s ease;pointer-events:none}
.dim{opacity:.35;transition:opacity .4s}
.slot{cursor:pointer}
.slot .ring{fill:none;stroke:var(--blue);stroke-width:3;stroke-dasharray:5 4;opacity:0}
.slot.active .ring{opacity:1}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.choice{flex:1 1 140px;min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:inherit;
font-size:15px;color:var(--navy);cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 10px}
.choice svg{flex:0 0 34px}
.choice.on{border-color:var(--blue);background:var(--blue-l)}
.slotbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.slotbtn{flex:1 1 200px;min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:15px;
color:var(--navy);cursor:pointer;text-align:left;padding:6px 12px}
.slotbtn.active{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-l)}
.slotbtn small{display:block;color:var(--gray);font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tab{min-height:44px;padding:6px 12px;border-radius:22px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:14px;
color:var(--navy);cursor:pointer}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tab.done:after{content:" ✓";color:var(--teal)} .tab.on.done:after{color:#9FE3DC}
.evbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
</style></head>

<div class="actions"><button class="btn primary" id="next" hidden>Следующий раунд</button></div></main><script>var D={"rounds": [{"svg": "v1", "prompt": "Диагностика. Найдите элемент, который ограничивает время удалённой диагностики.", "targets": ["timer"], "found": "Граничный таймер «30 минут» сидит на границе задачи и ограничивает её время.", "fine": {"diag": "Это задача — работа. Срок задаёт не она. Ищите элемент, который ограничивает её время.", "start": "Это стартовое событие-сообщение: процесс запускает обращение клиента. Время оно не ограничивает.", "ends": "Конечные события показывают исходы процесса. Время они не ограничивают.", "reg": "Это обычная задача. Ищите элемент, связанный с диагностикой.", "inform": "Это обычная задача. Ищите элемент, связанный с диагностикой.", "visit": "Эти задачи выполняются, когда срок уже истёк. Что запускает эту ветку?"}, "miss": "Не этот элемент. Ищите то, что ограничивает время диагностики.", "quiz": ["Что произойдёт с диагностикой, когда сработает таймер?", ["Прервётся", "Продолжится"], 0, "Контур таймера сплошной — это прерывающее событие. Токен уходит из задачи по ветке таймера, диагностика прекращается."], "after": {"btn": "Показать непрерывающий вариант", "svg": "v1b", "text": "Пунктирный контур — непрерывающий таймер. Через 30 минут появляется второй токен: заявка на выезд создаётся, а диагностика продолжается. По условию задачи 4.В так быть не должно — поэтому в эталоне контур сплошной."}}, {"svg": "v2", "prompt": "Зарплата. Найдите элемент, который стоит не на своём месте.", "targets": ["timer2"], "found": "Граничный таймер «5-й рабочий день» здесь не на месте: он не запускает начисление, а прерывает его.", "fine": {"start2": "Само событие допустимо, но оно не говорит, когда запускается процесс. Запомните это и ищите элемент не на своём месте.", "calc": "Задача на месте. Посмотрите, что сидит на её границе.", "pay": "Задача на месте.", "end2": "Конечные события показывают исходы. Ищите элемент, который стоит не на своём месте."}, "miss": "Не этот элемент. Какой элемент здесь связан со временем?", "quiz": ["Куда перенести таймер?", ["На старт процесса", "В поток после «Начислить зарплату»", "В конец процесса"], 0, "Зарплату начисляют по расписанию — значит, процесс запускает стартовый таймер. В потоке после начисления таймер только задержит выплату. В конец его не поставить: конечного таймера в BPMN нет."], "after": {"btn": "Показать исправленную схему", "svg": "v2b", "text": "Стартовый таймер «5-й рабочий день месяца» запускает процесс по расписанию: начислить, выплатить, конец."}}]};
var R=-1,got={},fb=document.getElementById('fb');
function say(cls,html){fb.className='fb '+cls;fb.innerHTML=html;}
function showVar(id){document.querySelectorAll('.var').forEach(function(v){v.hidden=(v.id!==id)});}
function clearMarks(){document.querySelectorAll('.hit').forEach(function(g){g.classList.remove('ok','no','sel')});}
function startRound(i){R=i;got={};var r=D.rounds[i];clearMarks();showVar(r.svg);
 document.querySelectorAll('.tab').forEach(function(t,j){t.classList.toggle('on',j===i)});
 document.getElementById('rnum').textContent='Раунд '+(i+1)+' из '+D.rounds.length;
 document.getElementById('prompt').innerHTML=r.prompt;
 document.getElementById('cntr').textContent=r.targets.length>1?('Найдено: 0 из '+r.targets.length):'';
 document.getElementById('quiz').innerHTML='';document.getElementById('after').innerHTML='';
 document.getElementById('next').hidden=true;say('info',r.start||'Нажмите на элемент на схеме.');}
function tap(id){var r=D.rounds[R];if(!r)return;
 if(r.targets.indexOf(id)>=0){if(got[id])return;got[id]=1;
  document.querySelectorAll('.var:not([hidden]) .hit[data-id="'+id+'"]').forEach(function(g){g.classList.add('ok')});
  var n=Object.keys(got).length;if(r.targets.length>1)document.getElementById('cntr').textContent='Найдено: '+n+' из '+r.targets.length;
  if(n===r.targets.length){say('good','<b>Верно.</b> '+r.found);quiz(r);}
  else say('good','<b>Верно.</b> '+(r.part||'Найдите остальные.'));return;}
 var t=(r.fine&&r.fine[id])||r.miss;say('info',t);
 document.querySelectorAll('.var:not([hidden]) .hit[data-id="'+id+'"]').forEach(function(g){g.classList.add('no');
  setTimeout(function(){g.classList.remove('no')},1200)});}
function quiz(r){var q=r.quiz,box=document.getElementById('quiz');if(!q){finish(r);return;}
 var d=document.createElement('div');d.className='q';d.innerHTML='<p>'+q[0]+'</p><div class="opts"></div><div class="expl" hidden></div>';
 var o=d.querySelector('.opts'),ex=d.querySelector('.expl');
 q[1].forEach(function(t,j){var b=document.createElement('button');b.className='opt';b.type='button';b.textContent=t;
  b.onclick=function(){o.querySelectorAll('.opt').forEach(function(x){x.classList.remove('right','wrong')});
   b.classList.add(j===q[2]?'right':'wrong');if(j!==q[2])o.children[q[2]].classList.add('right');
   ex.hidden=false;ex.innerHTML=(j===q[2]?'<b>Верно.</b> ':'<b>Не совсем.</b> ')+q[3];finish(r);};o.appendChild(b);});
 box.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'nearest'});}
function finish(r){var a=document.getElementById('after');
 if(r.after&&!a.innerHTML){var b=document.createElement('button');b.className='btn';b.textContent=r.after.btn;
  b.onclick=function(){showVar(r.after.svg);var p=document.createElement('p');p.className='hint';p.style.fontSize='15px';
   p.style.color='#1B2F4E';p.innerHTML=r.after.text;a.appendChild(p);b.disabled=true;
   document.getElementById('box').scrollIntoView({behavior:'smooth',block:'nearest'});};a.appendChild(b);}
 document.querySelectorAll('.tab')[R].classList.add('done');
 var nx=document.getElementById('next');nx.hidden=false;
 nx.textContent=R<D.rounds.length-1?'Следующий раунд':'Пройти заново';}
document.querySelectorAll('.hit').forEach(function(g){
 g.addEventListener('click',function(){tap(g.getAttribute('data-id'))});
 g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(g.getAttribute('data-id'))}});});
document.getElementById('next').onclick=function(){startRound(R<D.rounds.length-1?R+1:0);
 document.getElementById('rnum').scrollIntoView({behavior:'smooth'});};
document.querySelectorAll('.tab').forEach(function(t,j){t.onclick=function(){startRound(j)}});
startRound(0);
</script></body></html>
